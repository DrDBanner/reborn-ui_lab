  <text x="46" y="357" font-family="'SF Pro Text', 'SF Pro Display', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#AFB2BC" data-wrap-width="372">5 Favoriten</text>
  <text x="46" y="378" font-family="'SF Pro Text', 'SF Pro Display', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#AFB2BC" data-wrap-width="372">Beispielwerte nach dem Einlesen</text>
  <text x="24" y="519" font-family="'SF Pro Text', 'SF Pro Display', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#F4F5F7">Zielgerät</text>
  <rect x="154" y="493" width="286" height="38" rx="7" fill="#303238" stroke="#383A40" stroke-width="1"/>
