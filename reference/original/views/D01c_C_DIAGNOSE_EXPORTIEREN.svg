<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="464" height="750" viewBox="0 0 464 750" role="img">
  <title>Diagnose exportieren</title>
  <rect x="0" y="0" width="464" height="750" rx="14" fill="#26272C" stroke="#383A40" stroke-width="1"/>
  <text x="24" y="44" font-family="'SF Pro Text', 'SF Pro Display', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="630" fill="#F4F5F7">Diagnose exportieren</text>
  <g transform="translate(420 22) scale(0.9166666666666666)">
    <path d="M6 6l12 12 M18 6L6 18" fill="none" stroke="#AFB2BC" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="24" y="74" font-family="'SF Pro Text', 'SF Pro Display', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#AFB2BC" data-wrap-width="392">Nur speichern, nicht automatisch versenden.</text>
  <text x="24" y="136" font-family="'SF Pro Text', 'SF Pro Display', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="600" fill="#F4F5F7">Enthaltene Informationen</text>
  <g transform="translate(24 167) scale(0.8333333333333334)">
    <path d="M4 12l5 5L20 6" fill="none" stroke="#83B9FF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="57" y="183" font-family="'SF Pro Text', 'SF Pro Display', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#F4F5F7">App- und Gerätestand</text>
  <g transform="translate(24 219) scale(0.8333333333333334)">
    <path d="M4 12l5 5L20 6" fill="none" stroke="#83B9FF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="57" y="235" font-family="'SF Pro Text', 'SF Pro Display', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#F4F5F7">Fehler und Verbindungsereignisse</text>
  <g transform="translate(24 271) scale(0.8333333333333334)">
    <path d="M4 12l5 5L20 6" fill="none" stroke="#83B9FF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="57" y="287" font-family="'SF Pro Text', 'SF Pro Display', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#F4F5F7">Zeitstempel und Betriebszustände</text>
  <rect x="24" y="354" width="416" height="194" rx="10" fill="#26272C" stroke="#383A40" stroke-width="1"/>
  <text x="46" y="388" font-family="'SF Pro Text', 'SF Pro Display', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="600" fill="#F4F5F7">Vor dem Export prüfen</text>
  <text x="46" y="413" font-family="'SF Pro Text', 'SF Pro Display', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#AFB2BC" data-wrap-width="372">Die Datei zeigt vor dem Speichern eine Vorschau.</text>
  <text x="46" y="434" font-family="'SF Pro Text', 'SF Pro Display', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#AFB2BC" data-wrap-width="372">Zugangsdaten, sensible Streamparameter und andere</text>
  <text x="46" y="455" font-family="'SF Pro Text', 'SF Pro Display', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#AFB2BC" data-wrap-width="372">Geheimnisse müssen entfernt sein.</text>
  <rect x="24" y="575" width="416" height="36" rx="7" fill="#303238" stroke="#383A40" stroke-width="1"/>
  <g transform="translate(36 583.0) scale(0.8333333333333334)">
    <path d="M2 12q10-15 20 0-10 15-20 0z M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6" fill="none" stroke="#F4F5F7" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="64" y="598.0" font-family="'SF Pro Text', 'SF Pro Display', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="550" fill="#F4F5F7">Vorschau öffnen…</text>
  <text x="24" y="642" font-family="'SF Pro Text', 'SF Pro Display', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#AFB2BC" data-wrap-width="408">Die endgültige Datei wird erst nach Bestätigung am</text>
  <text x="24" y="663" font-family="'SF Pro Text', 'SF Pro Display', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#AFB2BC" data-wrap-width="408">gewählten Ort gespeichert.</text>
  <line x1="24" y1="674" x2="440" y2="674" stroke="#383A40" stroke-width="1" stroke-linecap="round"/>
  <rect x="164" y="693" width="128" height="36" rx="7" fill="#303238" stroke="#383A40" stroke-width="1"/>
  <text x="228.0" y="716.0" font-family="'SF Pro Text', 'SF Pro Display', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="550" fill="#F4F5F7" text-anchor="middle">Abbrechen</text>
  <rect x="304" y="693" width="136" height="36" rx="7" fill="#0A84FF" stroke-width="1"/>
  <text x="372.0" y="716.0" font-family="'SF Pro Text', 'SF Pro Display', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="550" fill="#F4F5F7" text-anchor="middle">Speichern…</text>
</svg>
