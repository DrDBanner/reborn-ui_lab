  </g>
  <text x="64" y="206.0" font-family="'SF Pro Text', 'SF Pro Display', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="550" fill="#F4F5F7">Datei öffnen…</text>
  <rect x="24" y="256" width="416" height="220" rx="10" fill="#26272C" stroke="#383A40" stroke-width="1"/>
