  <rect x="24" y="571" width="18" height="18" rx="4" fill="#303238" stroke="#383A40" stroke-width="1"/>
  <text x="54" y="585" font-family="'SF Pro Text', 'SF Pro Display', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#F4F5F7">Vorhandene Belegungen ersetzen</text>
  <text x="24" y="627" font-family="'SF Pro Text', 'SF Pro Display', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#AFB2BC" data-wrap-width="408">Nur tatsächlich enthaltene Daten anzeigen. Vor dem</text>
