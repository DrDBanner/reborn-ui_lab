  <text x="46" y="559" font-family="'SF Pro Text', 'SF Pro Display', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#AFB2BC" data-wrap-width="628">konkret anzeigen.</text>
  <text x="24" y="646" font-family="'SF Pro Text', 'SF Pro Display', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#AFB2BC" data-wrap-width="668">Ein Stereopaar ist kein bloßes Multiroom-Häkchen. Die Kanalzuordnung ist ein eigener, bewusster</text>
  <text x="24" y="667" font-family="'SF Pro Text', 'SF Pro Display', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#AFB2BC" data-wrap-width="668">Schritt.</text>
