<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="760" viewBox="0 0 720 760" role="img">
  <title>Lautsprecher einrichten</title>
  <rect x="0" y="0" width="720" height="760" rx="14" fill="#26272C" stroke="#383A40" stroke-width="1"/>
  <text x="24" y="44" font-family="'SF Pro Text', 'SF Pro Display', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="630" fill="#F4F5F7">Lautsprecher einrichten</text>
  <g transform="translate(676 22) scale(0.9166666666666666)">
    <path d="M6 6l12 12 M18 6L6 18" fill="none" stroke="#AFB2BC" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="24" y="74" font-family="'SF Pro Text', 'SF Pro Display', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#AFB2BC" data-wrap-width="648">Ein weiterer Lautsprecher wird hinzugefügt.</text>
  <rect x="24" y="113" width="672" height="40" rx="8" fill="#202125" stroke="#383A40" stroke-width="1"/>
  <rect x="27.0" y="116" width="166.5" height="34" rx="6" fill="#203955" stroke="#659FE5" stroke-width="1"/>
  <text x="110.25" y="138.0" font-family="'SF Pro Text', 'SF Pro Display', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#83B9FF" text-anchor="middle">1 Finden</text>
  <text x="276.75" y="138.0" font-family="'SF Pro Text', 'SF Pro Display', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#AFB2BC" text-anchor="middle">2 Prüfen</text>
  <text x="443.25" y="138.0" font-family="'SF Pro Text', 'SF Pro Display', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#AFB2BC" text-anchor="middle">3 Installieren</text>
  <text x="609.75" y="138.0" font-family="'SF Pro Text', 'SF Pro Display', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#AFB2BC" text-anchor="middle">4 Fertig</text>
  <text x="24" y="203" font-family="'SF Pro Text', 'SF Pro Display', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="630" fill="#F4F5F7">Im Netzwerk gefunden</text>
  <rect x="24" y="232" width="672" height="110" rx="10" fill="#26272C" stroke="#383A40" stroke-width="1"/>
  <g transform="translate(47 258) scale(1.9166666666666667)">
    <path d="M7 3h10v18H7z M10 7h4 M12 12a3 3 0 1 0 0 6 3 3 0 0 0 0-6" fill="none" stroke="#83B9FF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="117" y="272" font-family="'SF Pro Text', 'SF Pro Display', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="630" fill="#F4F5F7">SoundTouch 10</text>
  <text x="117" y="301" font-family="'SF Pro Text', 'SF Pro Display', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#AFB2BC">Bereit zur Einrichtung · 192.168.0.201</text>
  <g transform="translate(649 269) scale(0.9166666666666666)">
    <path d="M4 12l5 5L20 6" fill="none" stroke="#83B9FF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <rect x="24" y="370" width="672" height="155" rx="10" fill="#26272C" stroke="#383A40" stroke-width="1"/>
  <text x="46" y="404" font-family="'SF Pro Text', 'SF Pro Display', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="600" fill="#F4F5F7">Voraussetzungen</text>
  <text x="46" y="429" font-family="'SF Pro Text', 'SF Pro Display', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#AFB2BC" data-wrap-width="628">Computer und Lautsprecher müssen sich im selben erreichbaren Netzwerk befinden. Der</text>
  <text x="46" y="450" font-family="'SF Pro Text', 'SF Pro Display', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#AFB2BC" data-wrap-width="628">Lautsprecher bleibt eingeschaltet und am Strom.</text>
  <rect x="24" y="551" width="236" height="36" rx="7" fill="none" stroke-width="1"/>
  <g transform="translate(36 559.0) scale(0.8333333333333334)">
    <path d="M20 10a8 8 0 1 0-2 8 M20 3v7h-7" fill="none" stroke="#83B9FF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="64" y="574.0" font-family="'SF Pro Text', 'SF Pro Display', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="550" fill="#83B9FF">Erneut suchen</text>
  <rect x="444" y="551" width="252" height="36" rx="7" fill="none" stroke-width="1"/>
  <g transform="translate(456 559.0) scale(0.8333333333333334)">
    <path d="M12 16v-5 M12 7h.01 M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18" fill="none" stroke="#83B9FF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="484" y="574.0" font-family="'SF Pro Text', 'SF Pro Display', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="550" fill="#83B9FF">Gerät nicht gefunden?</text>
  <text x="24" y="642" font-family="'SF Pro Text', 'SF Pro Display', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#AFB2BC">Bereits eingerichtete Geräte werden gekennzeichnet, nicht erneut installiert.</text>
  <line x1="24" y1="684" x2="696" y2="684" stroke="#383A40" stroke-width="1" stroke-linecap="round"/>
  <rect x="420" y="703" width="128" height="36" rx="7" fill="#303238" stroke="#383A40" stroke-width="1"/>
  <text x="484.0" y="726.0" font-family="'SF Pro Text', 'SF Pro Display', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="550" fill="#F4F5F7" text-anchor="middle">Abbrechen</text>
  <rect x="560" y="703" width="136" height="36" rx="7" fill="#0A84FF" stroke-width="1"/>
  <text x="628.0" y="726.0" font-family="'SF Pro Text', 'SF Pro Display', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="550" fill="#F4F5F7" text-anchor="middle">Weiter</text>
</svg>
