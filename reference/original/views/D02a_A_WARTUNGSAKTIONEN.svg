<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="760" viewBox="0 0 720 760" role="img">
  <title>Wartungsaktionen</title>
  <rect x="0" y="0" width="720" height="760" rx="14" fill="#26272C" stroke="#383A40" stroke-width="1"/>
  <text x="24" y="44" font-family="'SF Pro Text', 'SF Pro Display', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="630" fill="#F4F5F7">Wartungsaktionen</text>
  <g transform="translate(676 22) scale(0.9166666666666666)">
    <path d="M6 6l12 12 M18 6L6 18" fill="none" stroke="#AFB2BC" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="24" y="74" font-family="'SF Pro Text', 'SF Pro Display', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#AFB2BC" data-wrap-width="648">David L · Selten benötigte Eingriffe</text>
  <g transform="translate(22 138) scale(0.875)">
    <path d="M20 10a8 8 0 1 0-2 8 M20 3v7h-7" fill="none" stroke="#AFB2BC" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="56" y="144" font-family="'SF Pro Text', 'SF Pro Display', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="500" fill="#F4F5F7">Lautsprecher neu starten…</text>
  <text x="56" y="166" font-family="'SF Pro Text', 'SF Pro Display', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#AFB2BC" data-wrap-width="612">Verbindung und Wiedergabe kurz unterbrechen.</text>
  <g transform="translate(683 164.0) scale(0.75)">
    <path d="M9 5l7 7-7 7" fill="none" stroke="#AFB2BC" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <line x1="24" y1="227" x2="696" y2="227" stroke="#383A40" stroke-width="1" stroke-linecap="round"/>
  <g transform="translate(22 255) scale(0.875)">
    <path d="M3 6h18 M8 6V3h8v3 M5 6l1 15h12l1-15 M9 10v7 M15 10v7" fill="none" stroke="#FF8585" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="56" y="261" font-family="'SF Pro Text', 'SF Pro Display', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="500" fill="#FF8585">STR entfernen…</text>
  <text x="56" y="283" font-family="'SF Pro Text', 'SF Pro Display', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#AFB2BC" data-wrap-width="612">STR-Software entfernen. Bose-System getrennt behandeln.</text>
  <g transform="translate(683 281.0) scale(0.75)">
    <path d="M9 5l7 7-7 7" fill="none" stroke="#AFB2BC" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <line x1="24" y1="344" x2="696" y2="344" stroke="#383A40" stroke-width="1" stroke-linecap="round"/>
  <g transform="translate(22 372) scale(0.875)">
    <path d="M12 3L2 21h20z M12 9v5 M12 17h.01" fill="none" stroke="#FF8585" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="56" y="378" font-family="'SF Pro Text', 'SF Pro Display', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="500" fill="#FF8585">Auf Werkseinstellungen zurücksetzen…</text>
  <text x="56" y="400" font-family="'SF Pro Text', 'SF Pro Display', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#AFB2BC" data-wrap-width="612">Datenumfang und Folgen im nächsten Schritt zeigen.</text>
  <g transform="translate(683 398.0) scale(0.75)">
    <path d="M9 5l7 7-7 7" fill="none" stroke="#AFB2BC" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <rect x="24" y="506" width="672" height="116" rx="10" fill="#26272C" stroke="#383A40" stroke-width="1"/>
  <text x="46" y="540" font-family="'SF Pro Text', 'SF Pro Display', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="600" fill="#F4F5F7">Kein universeller „Reset“-Knopf</text>
  <text x="46" y="565" font-family="'SF Pro Text', 'SF Pro Display', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#AFB2BC" data-wrap-width="628">Neustart, Entfernen und Werkseinstellungen sind unterschiedliche Operationen. Ihre Wirkung</text>
  <text x="46" y="586" font-family="'SF Pro Text', 'SF Pro Display', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#AFB2BC" data-wrap-width="628">wird nicht unter einem Sammelbegriff versteckt.</text>
  <line x1="24" y1="684" x2="696" y2="684" stroke="#383A40" stroke-width="1" stroke-linecap="round"/>
  <rect x="560" y="703" width="136" height="36" rx="7" fill="#0A84FF" stroke-width="1"/>
  <text x="628.0" y="726.0" font-family="'SF Pro Text', 'SF Pro Display', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="550" fill="#F4F5F7" text-anchor="middle">Schließen</text>
</svg>
