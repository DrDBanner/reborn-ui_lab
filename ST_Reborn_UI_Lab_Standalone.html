<!doctype html><html lang="en" data-theme="streborn-dark"><head><meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>ST Reborn — UI Lab · Single-file Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<style>:root {
  --accent: #79b8ff;
  --accent-rgb: 121,184,255;
  --density: 1;
  --radius: 12px;
  --font-size: 14px;
  --sidebar-width: 270px;
  --player-height: 82px;
  --bg: #16181c;
  --sidebar: #202227;
  --panel: #24262c;
  --panel-hi: #2d3038;
  --text: #f0f1f4;
  --muted: #a4aab5;
  --faint: #777e89;
  --border: #35383f;
  --ok: #68ce9a;
  --warn: #efbd6e;
  --bad: #e8818b;
  --card-gap: 14px;
}
[data-appearance="light"] {
  --bg: #f3f4f6;
  --sidebar: #f9fafb;
  --panel: #ffffff;
  --panel-hi: #edf0f4;
  --text: #1b2636;
  --muted: #637084;
  --faint: #788297;
  --border: #d8dce5;
}
[data-density="compact"] { --density: .8; --card-gap: 10px; }
[data-density="comfortable"] { --density: 1.15; --card-gap: 20px; }

/*
 * ST Reborn UI Lab: app-specific visual system.
 * Tailwind handles utilities; daisyUI supplies foundation controls; these rules
 * define the product's own appearance. All high-level tokens are in theme.css.
 */
*{box-sizing:border-box}
html,body,#app{min-height:100%;margin:0}
html{color-scheme:dark}
html[data-appearance=light]{color-scheme:light}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Arial,sans-serif;font-size:var(--font-size);line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.4}
button:not(:disabled),select,input{transition:border-color .15s,background-color .15s,box-shadow .15s}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent)!important;outline-offset:3px!important}
a{color:var(--accent)}
small{font-size:11px}
.material-symbols-rounded{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;font-size:21px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;word-wrap:normal;direction:ltr;font-feature-settings:'liga';-webkit-font-feature-settings:'liga';-webkit-font-smoothing:antialiased;flex-shrink:0;font-variation-settings:'FILL' 0,'wght' 350,'GRAD' 0,'opsz' 24}
.boot{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted)}
.app-shell{display:grid;grid-template-columns:var(--sidebar-width) minmax(0,1fr);min-height:100vh;padding-bottom:var(--player-height)}
.sidebar{background:var(--sidebar);border-right:1px solid var(--border);height:calc(100vh - var(--player-height));position:sticky;top:0;display:flex;flex-direction:column;overflow:hidden;min-width:0;z-index:4}
.brand{height:92px;display:flex;align-items:center;gap:12px;padding:22px 21px;flex-shrink:0}
.brand strong{display:block;font-size:17px;letter-spacing:-.4px}.brand em{font-style:italic;color:var(--accent)}
.brand small{display:block;font-size:10px;color:var(--faint);margin-top:3px;letter-spacing:.025em}
.brand-icon{background:color-mix(in srgb,var(--accent) 13%,transparent);color:var(--accent);display:grid;place-items:center;width:36px;height:36px;border-radius:10px}
.brand-icon .material-symbols-rounded{font-size:24px}.sidebar-close,.mobile-menu{display:none!important}
.sidebar-scroll{flex:1;overflow-y:auto;padding:0 13px 16px;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.sidebar-footer{flex-shrink:0;padding:11px 14px 13px;border-top:1px solid var(--border)}
.sidebar-build{font-size:10px;letter-spacing:.03em;color:var(--faint);padding:6px 12px}
.nav-section{border-top:1px solid var(--border);padding:12px 0 6px}
.nav-section__heading{display:flex;align-items:center;justify-content:space-between;padding:0 4px 7px 12px}
.nav-section__title{background:none;border:0;padding:4px 0;text-align:left;font-weight:700;letter-spacing:.13em;color:var(--faint);font-size:10px}
.nav-section__title:hover{color:var(--accent)}
.section-chevron{width:27px;height:26px;border:0;background:transparent;color:var(--muted);border-radius:6px;display:grid;place-items:center}
.section-chevron:hover{background:var(--panel-hi)}
.nav-section__content{display:flex;flex-direction:column;gap:3px}
.nav-item{width:100%;background:none;border:0;border-radius:8px;display:flex;align-items:center;text-align:left;gap:11px;color:var(--muted);min-height:37px;padding:8px 12px;font-size:12px}
.nav-item .material-symbols-rounded{font-size:18px}
.nav-item:hover,.output-item:hover{background:var(--panel-hi);color:var(--text)}
.nav-item.active,.nav-item--lab:hover{background:color-mix(in srgb,var(--accent) 20%,transparent);color:var(--accent)}
.nav-item--outline{color:var(--faint);font-size:11px}.nav-item--lab{color:var(--accent)}
.pinned-block{padding:0 1px 18px}.section-eyebrow{font-size:10px;letter-spacing:.13em;color:var(--faint);font-weight:700;padding:0 10px 9px}
.pinned-target{background:color-mix(in srgb,var(--accent) 12%,var(--panel));border:1px solid color-mix(in srgb,var(--accent) 34%,var(--border));border-radius:10px;width:100%;padding:12px 10px;display:flex;align-items:center;gap:10px;text-align:left;color:var(--text)}
.pinned-target>.material-symbols-rounded:first-child{color:var(--accent)}
.pinned-target>span:nth-child(2){flex:1;min-width:0}.pinned-target strong{font-size:12px;display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.pinned-target small{display:block;color:var(--muted);font-size:10px;margin-top:3px}
.pinned-target>.material-symbols-rounded:last-child{font-size:17px;color:var(--muted)}
.sidebar-output-line{display:flex;gap:2px;align-items:center;min-width:0}.sidebar-output-line .output-item{min-width:0;flex:1}
.sidebar-output-menu{flex-shrink:0;background:none;color:var(--faint);border:0;border-radius:6px;padding:6px}.sidebar-output-menu:hover{background:var(--panel-hi);color:var(--text)}
.sidebar-output-menu .material-symbols-rounded{font-size:18px}
.output-item{display:flex;gap:9px;width:100%;align-items:center;padding:7px 9px;border:0;background:transparent;color:var(--text);border-radius:8px;text-align:left}
.output-item.is-selected{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.output-item__symbol{width:25px;height:25px;display:grid;place-items:center;background:var(--panel-hi);border-radius:6px;color:var(--muted)}
.output-item__symbol .material-symbols-rounded{font-size:17px}
.output-item__body{flex:1;min-width:0}.output-item__body strong,.output-item__body small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.output-item__body strong{font-size:12px;font-weight:500}.output-item__body small{font-size:10px;color:var(--faint);margin-top:2px}
.output-item__trail .material-symbols-rounded{color:var(--faint);font-size:14px}.output-item__trail .eq-symbol{color:var(--accent)}
.sidebar-more{background:transparent;border:0;color:var(--accent);text-align:left;padding:7px 12px;font-size:11px}
.app-main{min-width:0;position:relative}
.app-header{height:80px;background:var(--bg);border-bottom:1px solid var(--border);padding:0 34px;display:flex;align-items:center;justify-content:space-between;gap:18px;position:sticky;top:0;z-index:3}
.header-title h1{margin:0;font-size:20px;font-weight:650;letter-spacing:-.5px}.header-title p{font-size:11px;color:var(--faint);margin:3px 0 0}
.header-left,.header-right{display:flex;align-items:center;gap:14px}.header-left{min-width:0}
.header-right{flex-shrink:0}.header-status{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:11px;white-space:nowrap}
.header-status i,.status i{display:inline-block;width:7px;height:7px;border-radius:100%;background:var(--ok)}
.workspace{max-width:1440px;min-height:calc(100vh - var(--player-height) - 80px);margin:0 auto;padding:31px 38px 70px}
.page-heading{display:flex;justify-content:space-between;align-items:start;gap:22px;margin:5px 0 26px}
.page-heading h1{font-size:25px;font-weight:700;letter-spacing:-.65px;margin:0 0 5px}
.page-heading p{color:var(--muted);font-size:12px;margin:0;line-height:1.65}.page-heading__tools{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.section-wrap{margin:27px 0 28px}.section-heading{display:flex;justify-content:space-between;align-items:end;gap:18px;margin:0 0 15px}
.section-heading h2{font-size:17px;letter-spacing:-.35px;font-weight:650;margin:0}.section-heading p{margin:4px 0 0;color:var(--faint);font-size:11px}
.btn-soft,.btn-quiet,.primary-btn,.danger-btn{border-radius:8px;border:1px solid var(--border);padding:9px 12px;display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap;font-size:12px;font-weight:550;background:var(--panel-hi);color:var(--text);text-decoration:none}
.btn-soft:hover,.btn-quiet:hover{background:color-mix(in srgb,var(--accent) 16%,var(--panel-hi));border-color:color-mix(in srgb,var(--accent) 45%,var(--border))}
.btn-quiet{background:transparent;color:var(--muted)}
.primary-btn{background:var(--accent);color:#101923;border-color:var(--accent);font-weight:650}.primary-btn:hover{filter:brightness(1.08)}
.danger-btn{background:transparent;border-color:color-mix(in srgb,var(--bad) 45%,var(--border));color:var(--bad)}
.danger-btn:hover{background:color-mix(in srgb,var(--bad) 10%,transparent)}
.text-action{color:var(--accent);font-size:11px;background:none;border:none;display:inline-flex;gap:7px;align-items:center}.text-action:hover{text-decoration:underline}
.icon-btn{color:var(--muted);border:1px solid transparent;border-radius:8px;background:transparent;width:34px;height:34px;display:inline-grid;place-items:center;flex-shrink:0}
.icon-btn:hover{color:var(--text);border-color:var(--border);background:var(--panel-hi)}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;min-width:0}
.panel-head{padding:20px 21px 8px}.panel-head h2{font-size:15px;letter-spacing:-.15px;font-weight:650;margin:0}.panel-head p{margin:4px 0 0;font-size:11px;color:var(--muted);line-height:1.5}
.panel-body{padding:12px 21px 20px}.panel-body>p{font-size:12px;color:var(--muted);line-height:1.75}
.panel--flush>.source-row,.panel--flush>.firmware-row,.panel--flush>.menu-row{padding-left:22px;padding-right:22px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:var(--card-gap);align-items:start}.two-col--wide{grid-template-columns:1.06fr .94fr}
.tile-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--card-gap)}
.preset-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--card-gap)}
.preset{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:17px 15px;display:flex;gap:12px;text-align:left;align-items:center;min-height:77px;transition:background .15s,border-color .15s}
.preset:hover{border-color:color-mix(in srgb,var(--accent) 60%,var(--border));background:var(--panel-hi)}
.preset__number{background:var(--panel-hi);border-radius:7px;width:35px;height:35px;display:grid;place-items:center;font-weight:750;font-size:17px;flex-shrink:0}
.preset__info{min-width:0;flex:1}.preset__info strong,.preset__info small{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.preset__info strong{font-size:13px}.preset__info small{font-size:10px;color:var(--muted);margin-top:3px}.preset>.material-symbols-rounded{font-size:17px;color:var(--accent)}
.source-tile{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:11px;padding:15px;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);min-height:157px;position:relative}
.source-tile:hover{border-color:var(--accent);background:var(--panel-hi)}.source-tile.is-selected{background:color-mix(in srgb,var(--accent) 14%,var(--panel))}
.source-art{display:grid;place-items:center;width:45px;height:45px;background:color-mix(in srgb,var(--source-color) 31%,var(--panel));border-radius:9px;color:var(--source-color)}
.source-art .material-symbols-rounded{font-size:26px}.source-art--sm{width:35px;height:35px;border-radius:7px;flex-shrink:0}.source-art--sm .material-symbols-rounded{font-size:19px}
.source-tile__content strong,.source-tile__content small{display:block}.source-tile__content strong{font-size:13px}.source-tile__content small{font-size:10px;color:var(--muted);margin-top:4px}
.source-tile__play{position:absolute;right:14px;bottom:15px;color:var(--accent)}
.toolbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:13px}
.search-field{display:flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--border);border-radius:8px;min-width:250px;flex:1;padding:0 11px;height:39px;color:var(--muted)}
.search-field input{background:none;border:none;outline:none;min-width:0;width:100%;font-size:12px;color:var(--text)}.search-field input:focus{outline:none!important}
.search-field .material-symbols-rounded{font-size:19px}.search-field:focus-within{border-color:var(--accent)}
.search-field--small{max-width:300px;min-width:170px;flex:0 1 250px}.small-select,.text-input{background:var(--panel-hi);color:var(--text);border:1px solid var(--border);border-radius:7px;padding:7px 10px;min-height:34px;font-size:12px;max-width:100%}
.segmented,.detail-tabs{display:flex;align-items:center;gap:2px;background:var(--panel);border:1px solid var(--border);padding:3px;border-radius:9px}
.tab-control{border:0;border-radius:6px;background:none;color:var(--muted);font-size:11px;padding:7px 12px;white-space:nowrap}
.tab-control:hover{background:var(--panel-hi);color:var(--text)}.tab-control.active{background:color-mix(in srgb,var(--accent) 22%,var(--panel));color:var(--accent);font-weight:650}
.detail-tabs{max-width:650px;margin:0 0 24px}.detail-tabs>.tab-control{flex:1;text-align:center}
.detail-body{display:flex;flex-direction:column;gap:18px}.meta-note{color:var(--faint);font-size:11px;margin-left:auto}
.source-list{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.source-row{display:flex;align-items:center;gap:13px;padding:10px 14px;min-height:62px;border-bottom:1px solid var(--border)}.source-row:last-child{border-bottom:0}
.source-row:hover{background:var(--panel-hi)}.source-row__main{flex:1;min-width:0}.source-row__main strong,.source-row__main small{display:block}
.source-row__main strong{font-size:12px;font-weight:600}.source-row__main small{color:var(--faint);font-size:10px;margin-top:2px}.source-row__genre{font-size:11px;color:var(--muted);min-width:100px}
.source-row__actions{display:flex;gap:3px}.source-row__actions .icon-btn{border:1px solid var(--border);background:var(--panel-hi)}
.server-list{padding:10px 14px 16px}.list-card{display:flex;align-items:center;width:100%;gap:12px;padding:12px;border-radius:9px;text-align:left;border:1px solid transparent;background:transparent}
.list-card>span:nth-child(2){flex:1}.list-card strong,.list-card small{display:block}.list-card strong{font-size:12px}.list-card small{color:var(--muted);margin-top:3px}.list-card.active,.list-card:hover{background:var(--panel-hi);border-color:var(--border)}
.folder-list{padding:8px 12px 15px}.folder-row{background:none;border:0;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:11px;padding:12px;width:100%;text-align:left;font-size:12px}
.folder-row:hover{color:var(--accent)}.folder-row span:nth-child(2){flex:1}.folder-row:last-child{border-bottom:0}
.spotify-header{display:flex;align-items:center;gap:20px;padding:20px 24px}.spotify-header div{flex:1}.spotify-header h2{font-size:17px;margin:0}.spotify-header p{font-size:12px;color:var(--muted)}.spotify-symbol{display:grid;place-items:center;width:56px;height:56px;border-radius:14px;background:#173e2b;color:#5bd59a}
.status{display:inline-flex;align-items:center;gap:7px;font-size:10px;font-weight:550;color:var(--muted);white-space:nowrap}
.status--offline i{background:var(--faint)}.status--partial i,.status--needs_setup i,.status--updating i,.status--update i{background:var(--warn)}
.status--updating,.status--update{color:var(--warn)}.status--offline{color:var(--faint)}
.summary-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--card-gap);margin-bottom:24px}
.summary-strip>div{padding:19px 22px;border:1px solid var(--border);border-radius:var(--radius);background:var(--panel);display:flex;align-items:baseline;gap:10px}
.summary-strip strong{font-size:27px;line-height:1.2;font-weight:700;letter-spacing:-1px}.summary-strip span{color:var(--muted);font-size:11px}
.targets-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--card-gap)}
.target-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:17px;min-width:0}
.target-card--checked{border-color:var(--accent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 40%,transparent)}
.target-card__header{display:flex;align-items:center;gap:11px}.target-card__icon{height:41px;width:41px;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 10%,var(--panel-hi));color:var(--accent);border-radius:10px;flex-shrink:0}
.target-card__title{flex:1;min-width:0}.target-card__title strong{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:13px}.target-card__title small{display:block;color:var(--faint);margin-top:3px}
.target-card__header input{accent-color:var(--accent);width:15px;height:15px}
.target-card__status{display:flex;align-items:center;gap:9px;margin:18px 0 12px}.micro{color:var(--faint);font-size:10px;max-width:140px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.target-card__stream{min-height:26px;font-size:11px;color:var(--accent);display:flex;align-items:center;margin-bottom:17px}.target-card__stream span{display:inline-flex;align-items:center;gap:5px}
.target-card__stream .material-symbols-rounded{font-size:15px}.target-card__stream .muted{color:var(--faint)}
.target-card__actions{border-top:1px solid var(--border);padding-top:13px;display:flex;gap:7px}.target-card__actions button{flex:1;font-size:11px;padding:7px 9px}
.selection-bar{border:1px solid color-mix(in srgb,var(--accent) 40%,var(--border));background:color-mix(in srgb,var(--accent) 9%,var(--panel));border-radius:9px;padding:10px 13px;display:flex;gap:12px;align-items:center;margin-bottom:15px}
.selection-bar span{color:var(--accent);font-size:12px;font-weight:600;margin-right:auto}
.explain-note{font-size:11px;line-height:1.65;color:var(--faint);margin:20px 0}
.key-values>div{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--border);font-size:12px}
.key-values>div:last-child{border-bottom:0}.key-values>div>span:first-child{color:var(--muted)}.key-values strong{font-weight:550;text-align:right}
.setting-line{display:flex;align-items:center;gap:13px;border-bottom:1px solid var(--border);padding:14px 0;min-height:62px}
.setting-line:last-child{border-bottom:0}.setting-line__icon{color:var(--muted)}.setting-line__body{flex:1;min-width:0}.setting-line__body strong{display:block;font-size:12px}.setting-line__body small{display:block;color:var(--faint);margin-top:3px;line-height:1.45}
.form-row{display:grid;grid-template-columns:190px minmax(0,1fr);gap:20px;align-items:center;border-bottom:1px solid var(--border);padding:17px 0;font-size:12px}
.form-row:last-child{border-bottom:0}.form-row label{color:var(--text)}.form-row label>small{display:block;color:var(--faint);line-height:1.5;font-size:10px;margin-top:5px}
.form-row__control{min-width:0;display:flex;align-items:center;gap:10px}.form-row__control>*{max-width:100%}
.range-row{display:flex;align-items:center;gap:10px;width:100%}.range-row span{font-size:10px;color:var(--muted)}.range-row strong{width:26px;text-align:right;font-size:11px}
input[type=range]{accent-color:var(--accent);width:100%;min-width:40px;cursor:pointer}
input[type=checkbox],input[type=radio]{accent-color:var(--accent)}
input[role=switch]{appearance:none;width:35px;height:20px;display:inline-block;border-radius:99px;background:var(--panel-hi);border:1px solid var(--border);position:relative;cursor:pointer;flex-shrink:0}

input[role=switch]:checked{background:var(--accent);border-color:var(--accent)}input[role=switch]:checked:after{left:17px;background:#122035}

<script>// ===== src/app/model.js =====
/** Pure domain selectors and state transforms. No DOM, no Wails dependencies. */
function entity(model, id) {
  if (!model || !id) return null;
  return [...model.devices, ...model.pairs, ...model.groups].find(item => item.id === id) ?? null;
}

function kind(model, id) {
  if (model.devices.some(x => x.id === id)) return 'device';
  if (model.pairs.some(x => x.id === id)) return 'pair';
  if (model.groups.some(x => x.id === id)) return 'group';
  return null;
}

function leafDeviceIds(model, targetId, visited = new Set()) {
  if (!targetId || visited.has(targetId)) return [];
  visited.add(targetId);
  const type = kind(model, targetId);
  if (type === 'device') return [targetId];
  const t = entity(model, targetId);
  return t ? [...new Set((t.memberIds || []).flatMap(id => leafDeviceIds(model, id, new Set(visited))))] : [];
}

function getTargets(model) {
  return [
    ...model.groups.map(x => ({...x, type: 'group'})),
    ...model.pairs.map(x => ({...x, type: 'pair'})),
    ...model.devices.map(x => ({...x, type: 'device'})),
  ];
}

function parentIds(model, targetId) {
  return [...model.pairs, ...model.groups].filter(x => x.memberIds?.includes(targetId)).map(x => x.id);
}

function visibleOutputs(model) {
  // A speaker within a pair, or a pair/speaker within a group, is represented by its parent.
  return getTargets(model).filter(t => !parentIds(model, t.id).length);
}

function targetStatus(model, targetId) {
  const ids = leafDeviceIds(model, targetId);
  if (!ids.length) return 'unknown';
  const statuses = ids.map(id => entity(model, id)?.status);
  if (statuses.every(s => s === 'offline')) return 'offline';
  if (statuses.some(s => s === 'needs_setup')) return 'needs_setup';
  if (statuses.some(s => s === 'updating')) return 'updating';
  if (statuses.some(s => s === 'offline')) return 'partial';
  return 'online';
}

function sessionFor(model, targetId) {
  return model.sessions.find(x => x.targetId === targetId) ?? null;
}

function effectiveSessionFor(model, targetId) {
  const exact=sessionFor(model,targetId);
  if(exact)return exact;
  const deviceIds=new Set(leafDeviceIds(model,targetId));
  return model.sessions.find(session=>leafDeviceIds(model,session.targetId).some(id=>deviceIds.has(id)))||null;
}

function currentSession(model) {
  return model.sessions.find(x => x.id === model.selectedSessionId) ?? model.sessions[0] ?? null;
}

function source(catalog, sourceId) {
  return catalog?.sources?.find(x => x.id === sourceId) ?? null;
}

function conflictingSessionIds(model, targetId) {
  const ids = new Set(leafDeviceIds(model, targetId));
  return model.sessions.filter(session => leafDeviceIds(model, session.targetId).some(id => ids.has(id))).map(session => session.id);
}

function assignSource(model, sourceId, targetId) {
  if (!entity(model, targetId)) throw new Error('Output not found');
  if (targetStatus(model, targetId) === 'offline') throw new Error('Output is offline');
  if (targetStatus(model, targetId) === 'needs_setup') throw new Error('Complete setup first');
  if (targetStatus(model, targetId) === 'updating') throw new Error('Wait for the firmware update');
  const existing = new Set(conflictingSessionIds(model, targetId));
  model.sessions = model.sessions.filter(x => !existing.has(x.id));
  const id = `s${Date.now()}${Math.floor(Math.random() * 1000)}`;
  model.sessions.push({id, sourceId, targetId, status:'playing', volume:entity(model,targetId).volume ?? 25});
  model.selectedSessionId = id;
  model.selectedOutputId = targetId;
  model.selectedSourceId = sourceId;
  return id;
}

function validateGroupMembers(model, memberIds, type = 'group') {
  const unique = [...new Set(memberIds)];
  if (unique.length !== memberIds.length) return 'Duplicate group members';
  if (type === 'pair' && unique.length !== 2) return 'A stereo pair requires exactly two speakers';
  if (type === 'group' && unique.length < 2) return 'Select at least two outputs';
  for (const id of unique) {
    if (!entity(model, id)) return `Output ${id} does not exist`;
    if (type === 'pair' && kind(model,id) !== 'device') return 'Stereo pairs can contain speakers only';
    if (type === 'group' && kind(model,id) === 'group') return 'Nested groups are reserved for a separate topology concept';
    if (parentIds(model,id).length) return `${entity(model,id).name} already belongs to a pair or group`;
  }
  return null;
}

function createComposite(model, type, name, memberIds, persistent = true) {
  const error = validateGroupMembers(model, memberIds, type);
  if (error) throw new Error(error);
  const id = `${type === 'pair' ? 'p' : 'g'}${Date.now()}`;
  const record = {id,name: name.trim() || (type==='pair' ? 'Stereo Pair' : 'New Group'),memberIds:[...memberIds],persistent,volume:25};
  (type==='pair' ? model.pairs : model.groups).push(record);
  model.selectedOutputId=id;
  return id;
}

function dissolveComposite(model,id) {
  const type=kind(model,id);
  if (type==='pair') model.pairs=model.pairs.filter(x=>x.id!==id);
  if (type==='group') model.groups=model.groups.filter(x=>x.id!==id);
  model.sessions=model.sessions.filter(x=>x.targetId!==id);
  model.groups.forEach(g=>g.memberIds=g.memberIds.filter(x=>x!==id));
  if(model.selectedOutputId===id) model.selectedOutputId=null;
}

function removeDevice(model, deviceId) {
  if(!model.devices.some(d=>d.id===deviceId)) return;
  model.devices=model.devices.filter(d=>d.id!==deviceId);
  const destroyedPairs=new Set(model.pairs.filter(p=>p.memberIds.includes(deviceId)).map(p=>p.id));
  model.pairs=model.pairs.filter(p=>!destroyedPairs.has(p.id));
  model.groups.forEach(g=>{g.memberIds=g.memberIds.filter(x=>x!==deviceId&&!destroyedPairs.has(x))});
  model.groups=model.groups.filter(g=>g.memberIds.length>=2);
  const remainingIds=new Set([...model.devices,...model.pairs,...model.groups].map(x=>x.id));
  model.sessions=model.sessions.filter(x=>remainingIds.has(x.targetId));
  if(!model.sessions.some(x=>x.id===model.selectedSessionId))model.selectedSessionId=model.sessions[0]?.id||null;
  if(!remainingIds.has(model.selectedOutputId))model.selectedOutputId=null;
  if(model.selectedDeviceId===deviceId)model.selectedDeviceId=model.devices[0]?.id||null;
}

function updateMembership(model,groupId,memberId,shouldAdd) {
  const group=model.groups.find(x=>x.id===groupId);
  if(!group) throw new Error('Group not found');
  if(shouldAdd) {
    if(parentIds(model,memberId).length) throw new Error('Output already belongs to a group');
    if(!entity(model,memberId)) throw new Error('Output not found');
    if(groupId===memberId||leafDeviceIds(model,memberId).some(id=>leafDeviceIds(model,groupId).includes(id))) throw new Error('Invalid or duplicate members');
    group.memberIds.push(memberId);
  } else {
    group.memberIds=group.memberIds.filter(x=>x!==memberId);
  }
}

function validateScenario(m) {
  if(!m || !Array.isArray(m.devices) || !Array.isArray(m.pairs) || !Array.isArray(m.groups) || !Array.isArray(m.sessions)) return ['Missing arrays: devices, pairs, groups, sessions'];
  const errors=[];
  if(!m.settings || typeof m.settings!=='object') errors.push('Missing settings object');
  if(!m.ui || typeof m.ui!=='object') errors.push('Missing ui object');
  for(const key of ['favorites','history','setupCandidates'])if(!Array.isArray(m[key]))errors.push(`Missing ${key} array`);
  const ids=[...m.devices,...m.pairs,...m.groups].map(x=>x.id);
  if(new Set(ids).size!==ids.length) errors.push('Entity IDs must be unique');
  for(const comp of [...m.pairs,...m.groups]) {
    if(!Array.isArray(comp.memberIds)) {errors.push(`${comp.id}: memberIds must be an array`);continue}
    for(const id of comp.memberIds) if(!ids.includes(id))errors.push(`${comp.id}: missing member ${id}`);
    if(leafDeviceIds(m,comp.id).length === 0) errors.push(`${comp.id}: no physical devices`);
  }
  for(const s of m.sessions) if(!ids.includes(s.targetId))errors.push(`${s.id}: missing output ${s.targetId}`);
  return errors;
}

const listeners=new Set();
const state={catalog:null,scenarioIndex:[],uiLayout:null,variants:null,scenarioId:'home',model:null,
  view:'listen', detailDeviceId:null, detailOutputId:null, selectedSourceId:null,
  modal:null, toast:null, sidebarOpen:false, speakerPickerFor:null, filter:'', outputSearch:'', selectedForComposite:[],
  setupStep:0, setupSelection:null, designOpen:false, designTokens:null, scenarioEditorOpen:false,
  expandingOutputs:false, alert:null};

function subscribe(listener){listeners.add(listener);return()=>listeners.delete(listener)}
function notify(){for(const fn of listeners)fn(state)}
function mutate(fn,persist=true){fn(state);if(persist)save();notify()}
function save(){if(!state.model)return;try{localStorage.setItem(`streborn-lab:${state.scenarioId}`,JSON.stringify(state.model));localStorage.setItem('streborn-lab:design',JSON.stringify(state.designTokens));}catch{}}
function resetUi(){state.filter='';state.outputSearch='';state.detailDeviceId=null;state.detailOutputId=null;state.selectedForComposite=[];state.setupStep=0;state.expandingOutputs=false;state.modal=null;state.toast=null;state.scenarioEditorOpen=false;}
async function initialize(){
  const [index,catalog,design,uiLayout,variants]=await Promise.all(['/data/scenario-index.json','/data/catalog.json','/data/design-tokens.json','/data/ui-layout.json','/data/variants.json'].map(url=>fetch(url).then(r=>{if(!r.ok)throw new Error(`Failed to load ${url}`);return r.json()})));
  state.catalog=catalog;state.scenarioIndex=index;state.uiLayout=uiLayout;state.variants=variants;state.designTokens=design;
  try{const saved=localStorage.getItem('streborn-lab:design');if(saved)state.designTokens={...design,...JSON.parse(saved)}}catch{}
  applyDesign();await loadScenario('home',true);
}
async function loadScenario(id,initial=false,reset=false){
  if(!state.scenarioIndex.some(x=>x.id===id))throw new Error('Unknown scenario');
  const response=await fetch(`/data/scenarios/${id}.json`);if(!response.ok)throw new Error('Scenario file unavailable');
  let model=await response.json();
  if(!reset){try{const saved=localStorage.getItem(`streborn-lab:${id}`);if(saved)model=JSON.parse(saved)}catch{}}
  const errors=validateScenario(model);if(errors.length)throw new Error(errors.join('; '));
  state.scenarioId=id;state.model=model;state.view=model.activeView || 'listen';
  resetUi();if(reset)save();if(!initial)toast(`${state.scenarioIndex.find(s=>s.id===id)?.name} loaded`);notify();

// ===== src/app/controller.js =====



function navigate(view){mutate(s=>{s.view=view;s.sidebarOpen=false;s.filter='';s.modal=null;s.selectedForComposite=[];});}
function openModal(kind,extras={}){mutate(s=>s.modal={kind,...extras},false)}
function closeModal(){mutate(s=>s.modal=null,false)}
function confirmAction(title,description,callback){if(window.confirm(`${title}\n\n${description}`))callback()}
function exported(name,obj){const blob=new Blob([JSON.stringify(obj,null,2)+'\n'],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.download=name;a.href=url;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function notifySafe(task){try{task()}catch(err){toast(err?.message||String(err))}}
function currentDevice(){return entity(state.model,state.detailDeviceId||state.model.selectedDeviceId)}
function generic(title,description,body=''){openModal('generic',{title,description,body})}

async function onAction(action,element){
 const m=state.model,id=element.dataset.id,val=element.dataset.value;
 try{switch(action){
 case 'navigate':navigate(val);break;
 case 'toggle-section':mutate(s=>{s.model.ui.collapsed[val]=!s.model.ui.collapsed[val]});break;
 case 'toggle-sidebar-mobile':mutate(s=>{s.sidebarOpen=!s.sidebarOpen},false);break;
 case 'expand-outputs':mutate(s=>s.expandingOutputs=true,false);break;
 case 'toggle-appearance':mutate(s=>{s.designTokens.appearance=s.designTokens.appearance==='dark'?'light':'dark';applyDesign()});break;
 case 'select-output':mutate(s=>{s.model.selectedOutputId=id;s.sidebarOpen=false;s.detailOutputId=id;if(kind(m,id)==='device'){s.detailDeviceId=id;s.model.selectedDeviceId=id;s.view='device'}else{s.view='group'}});break;
 case 'device-open':mutate(s=>{s.detailDeviceId=id;s.model.selectedDeviceId=id;s.view='device';s.model.ui.deviceTab='overview';s.modal=null;});break;
 case 'group-open':mutate(s=>{s.detailOutputId=id;s.model.selectedOutputId=id;s.view='group';s.modal=null});break;
 case 'target-actions':{
  const target=entity(m,id),type=kind(m,id);generic(target.name,'Quick actions for this output',`<div class="button-row"><button class="btn-soft" data-action="target-play" data-id="${esc(id)}">${icon('play_arrow')} Play selected source</button><button class="btn-soft" data-action="${type==='device'?'device-open':'group-open'}" data-id="${esc(id)}">${icon('tune')} Manage</button></div>`);break;
 }
 case 'target-play':{const src=m.selectedSourceId||currentSession(m)?.sourceId||'flux';mutate(s=>{assignSource(s.model,src,id);s.modal=null;});break}
 case 'open-output-picker':mutate(s=>{s.speakerPickerFor=m.selectedSourceId||currentSession(m)?.sourceId||'flux';s.modal={kind:'picker'}},false);break;
 case 'source-select':mutate(s=>{s.model.selectedSourceId=id;s.speakerPickerFor=id;s.modal={kind:'picker'}},false);break;
 case 'assign-output':{const src=state.speakerPickerFor||m.selectedSourceId||currentSession(m)?.sourceId||'flux';mutate(s=>{assignSource(s.model,src,id);s.model.history=[src,...s.model.history.filter(x=>x!==src)].slice(0,20);s.modal=null;s.speakerPickerFor=null;});toast(`Playing on ${entity(m,id)?.name}`);break}
 case 'source-info':{const d=source(state.catalog,id);generic(d?.name||'Source',`${d?.type||''} · ${d?.country||''} · ${d?.bitrate||''}`,`<div class="key-values"><div><span>Genre</span><strong>${esc(d?.genre)}</strong></div><div><span>Station</span><strong>${esc(d?.subtitle)}</strong></div></div>`);break}
 case 'toggle-favorite':mutate(s=>{s.model.favorites=s.model.favorites.includes(id)?s.model.favorites.filter(x=>x!==id):[...s.model.favorites,id]});break;
 case 'radio-tab':mutate(s=>{s.model.ui.radioTab=val;s.filter=''});break;
 case 'radio-filter':generic('Radio filters','Choose from the available filters.',`<div class="form-row"><label>Genre</label><select id="radio-genre" class="small-select">${['All','Pop','Alternative','Information','News','Culture','Oldies'].map(x=>`<option ${m.settings.radioGenre===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="modal-footer"><button class="primary-btn" data-action="apply-radio-filter">Apply</button></div>`);break;
 case 'apply-radio-filter':{const genre=document.getElementById('radio-genre')?.value||'All';mutate(s=>{s.model.settings.radioGenre=genre;s.modal=null});break}
 case 'preset-play':{const d=entity(m,m.selectedOutputId)||m.devices[0],sid=d?.presets?.[Number(val)];if(!sid)throw new Error('No station assigned to this key');mutate(s=>{s.model.selectedSourceId=sid;s.speakerPickerFor=sid;s.modal={kind:'picker'}},false);break}
 case 'preset-edit':openModal('preset');break;
 case 'preset-save':{
  const d=document.getElementById('preset-device')?.value;
  const selects=[...document.querySelectorAll('[data-preset-index]')];const presets=selects.map(x=>x.value||null);
  mutate(s=>{const device=entity(s.model,d);if(!device||kind(s.model,d)!=='device')throw new Error('Select a physical speaker');device.presets=presets;s.model.selectedOutputId=d;s.modal=null});toast('Quick presets updated (mock data)');break;
 }
 case 'library-server':mutate(s=>s.model.ui.libraryServer=id);break;
 case 'library-folder':generic(val,'Folder contents (simulated)',`<p>In the production application this view will request folders and tracks from the current music server. No playback engine is reimplemented here.</p>`);break;
 case 'spotify-connect':mutate(s=>s.model.spotifyConnected=!s.model.spotifyConnected);break;
 case 'filter-outputs':mutate(s=>s.model.ui.outputFilter=val);break;
 case 'clear-selected':mutate(s=>s.selectedForComposite=[],false);break;
 case 'start-group-create':mutate(s=>s.modal={kind:'create',type:'group'},false);break;
 case 'start-pair-create':mutate(s=>s.modal={kind:'create',type:'pair'},false);break;
 case 'composite-create':{
   const type=state.modal.type,name=document.getElementById('composite-name')?.value||'';
   const members=[...document.querySelectorAll('input[name="compositeMember"]:checked')].map(x=>x.value);
   const persistent=document.getElementById('composite-persistent')?.checked??true;
   mutate(s=>{const outputId=createComposite(s.model,type,name,members,persistent);s.detailOutputId=outputId;s.view='group';s.modal=null;s.selectedForComposite=[]});toast(type==='pair'?'Stereo pair created':'Group created');break;
 }
 case 'add-member':{
  const group=entity(m,state.detailOutputId),candidates=visibleOutputs(m).filter(t=>t.id!==group.id);
  generic('Add output',`Add an ungrouped speaker or pair to ${group.name}.`, `<div class="modal-list">${candidates.map(t=>`<button class="modal-output" data-action="group-add-item" data-id="${t.id}">${icon(t.memberIds?'speaker_group':'speaker')}<span>${esc(t.name)}</span>${icon('add')}</button>`).join('')}</div>`);break;
 }
 case 'group-add-item':mutate(s=>{updateMembership(s.model,s.detailOutputId,id,true);s.modal=null});break;
 case 'remove-member':confirmAction('Remove member','The speaker will become available as an individual output.',()=>mutate(s=>updateMembership(s.model,s.detailOutputId,id,false)));break;
 case 'dissolve-group':confirmAction('Dissolve this output?','The member speakers will remain configured and available.',()=>mutate(s=>{dissolveComposite(s.model,s.detailOutputId);s.detailOutputId=null;s.view='outputs'}));break;
 case 'player-toggle':mutate(s=>{const session=currentSession(s.model);if(session)session.status=session.status==='playing'?'paused':'playing'});break;
 case 'player-stop':mutate(s=>{const session=currentSession(s.model);if(session)session.status='stopped'});break;
 case 'session-prev':case 'session-next':mutate(s=>{const list=s.model.sessions;if(!list.length)return;const ix=list.findIndex(x=>x.id===s.model.selectedSessionId);const next=action==='session-next'?ix+1:ix-1;s.model.selectedSessionId=list[(next+list.length)%list.length].id});break;
 case 'device-tab':mutate(s=>s.model.ui.deviceTab=val);break;
 case 'settings-tab':mutate(s=>s.model.ui.settingsTab=val);break;
 case 'device-info':{const d=currentDevice();generic('Device information',`${d.name} · Data returned by the device.`,`<div class="key-values"><div><span>Model</span><strong>${esc(d.model)}</strong></div><div><span>IP address</span><strong>${esc(d.ip)}</strong></div><div><span>Firmware</span><strong>${esc(d.firmware)}</strong></div><div><span>Network</span><strong>${esc(d.network)}</strong></div></div>`);break}
 case 'remote-preview':generic('Phone remote','This would use the real remote endpoint in the integrated application.','<p>A mocked remote is not a second source of truth. The production frontend should reuse the device endpoint returned by the backend.</p>');break;
 case 'remote-qr':generic('Remote QR','QR codes should be generated from a verified backend endpoint.','<p>Not generated in the offline UI demo: no real device address was verified.</p>');break;
 case 'wifi-change':if(currentDevice()?.status==='offline')throw new Error('Device is offline');openModal('wifi');break;
 case 'wifi-save':{const net=document.getElementById('wifi-network')?.value;mutate(s=>{entity(s.model,s.detailDeviceId||m.selectedDeviceId).network=net;s.modal=null});toast('Network change simulated; verify rediscovery in production');break}
 case 'device-ping':toast(`${currentDevice()?.name}: ${currentDevice()?.status==='offline'?'No response':'Device responded (mock)'}`);break;
 case 'device-maintenance':openModal('maintenance');break;
 case 'device-restart':{const d=currentDevice();confirmAction('Restart device?',`This simulates restarting ${d?.name}.`,()=>{closeModal();toast('Restart simulated')});break}
 case 'device-remove':{const d=currentDevice();confirmAction('Remove device?',`Remove ${d?.name} from the local scenario?`,()=>mutate(s=>{removeDevice(s.model,d.id);s.view='outputs';s.modal=null}));break}
 case 'device-reset':confirmAction('Factory reset?',`This is a simulation only. No command will be sent.`,()=>{closeModal();toast('Reset simulation completed')});break;
 case 'alarms':generic('Alarms','View and configure device alarms.','<p>The scenario includes the alarm collection. Real scheduling and confirmation are backend responsibilities.</p>');break;
 case 'button-actions':generic('Button actions','Assign supported actions to hardware buttons.','<p>This module will use per-device action definitions supplied by the backend.</p>');break;
 case 'check-updates':toast('Simulated version check completed');break;
 case 'update-start':mutate(s=>{const d=entity(s.model,id);if(d&&d.status==='online'){d.status='updating';d.updateProgress=5}});break;
 case 'advance-updates':mutate(s=>s.model.devices.forEach(d=>{if(d.status==='updating'){d.updateProgress=Math.min(100,(d.updateProgress||0)+25);if(d.updateProgress===100){d.status='online';d.firmware=d.firmwareLatest;d.firmwareAvailable=false}}}));break;
 case 'diagnostics':generic('Diagnostics','Simulated diagnostic summary',`<div class="key-values"><div><span>Known speakers</span><strong>${m.devices.length}</strong></div><div><span>Unavailable</span><strong>${m.devices.filter(x=>x.status==='offline').length}</strong></div><div><span>Firmware operations</span><strong>${m.devices.filter(x=>x.status==='updating').length}</strong></div></div>`);break;
 case 'backup':exported('streborn-ui-settings-backup.json',{devices:m.devices.map(d=>({id:d.id,name:d.name,presets:d.presets,alarms:d.alarms,buttonActions:d.buttonActions})),settings:m.settings});toast('Downloaded sample settings backup');break;
 case 'restore':generic('Restore settings','Choose a backup in the production implementation.','<p>Restoring requires validation against actual speakers and their capabilities. UI Lab does not apply a backup automatically.</p>');break;
 case 'setup-next':if(state.setupStep===0){if(!state.setupSelection)throw new Error('Select a speaker');mutate(s=>s.setupStep=1,false)}else if(state.setupStep===1){const name=document.getElementById('setup-name')?.value.trim()||'New Speaker';const network=document.getElementById('setup-network')?.value||'Home Network';const cand=m.setupCandidates.find(x=>x.id===state.setupSelection);mutate(s=>{const id=`d${Math.max(0,...s.model.devices.map(d=>Number(d.id.replace(/\D/g,''))||0))+1}`;s.model.devices.push({id,name,model:'SoundTouch 10',ip:cand?.ip||'192.168.0.221',status:'online',firmware:'27.0.6',firmwareLatest:'27.0.6',firmwareAvailable:false,updateProgress:0,volume:25,bass:0,startVolumeEnabled:false,startVolume:20,language:'English',network,presets:[null,null,null,null,null,null],alarms:[],buttonActions:[]});s.model.selectedDeviceId=id;s.model.selectedOutputId=id;s.setupStep=2})}break;
 case 'setup-back':mutate(s=>s.setupStep=Math.max(0,s.setupStep-1),false);break;
 case 'help-open':generic(val==='guide'?'User guide':val==='feedback'?'Report a problem':'Wishes & voting', 'External project resources are not opened automatically.', '<p>Use the links and contribution process in the ST Reborn repository.</p>');break;
 case 'toggle-json-editor':mutate(s=>s.scenarioEditorOpen=!s.scenarioEditorOpen,false);break;
 case 'apply-json':applyScenarioJson(document.getElementById('scenario-json-editor')?.value||'');break;
 case 'export-scenario':exported(`streborn-${state.scenarioId}.json`,m);break;
 case 'export-tokens':exported('streborn-design-tokens.json',state.designTokens);break;
 case 'reset-scenario':await loadScenario(state.scenarioId,false,true);break;
 case 'load-scenario':await loadScenario(id);break;
 case 'close-modal':closeModal();break;
 case 'dismiss-toast':mutate(s=>s.toast=null,false);break;
 default:console.warn('Unhandled action:',action);
 }}catch(err){toast(err?.message||String(err))}
}

async function onField(field,target){
 const m=state.model,val=target.value;
 try{switch(field){
 case 'scenario':await loadScenario(val);break;
 case 'speaker-variant':mutate(s=>s.model.ui.speakerVariant=val);break;
 case 'radio-search':mutate(s=>s.filter=val,false);break;
 case 'output-search':mutate(s=>s.outputSearch=val,false);break;
 case 'member-select':mutate(s=>{s.selectedForComposite=target.checked?[...new Set([...s.selectedForComposite,val])]:s.selectedForComposite.filter(x=>x!==val)},false);break;
 case 'session':mutate(s=>s.model.selectedSessionId=val);break;
 case 'volume':mutate(s=>{const session=currentSession(s.model);if(session)session.volume=Number(val)});break;
 case 'composite-volume':mutate(s=>{const g=entity(s.model,s.detailOutputId);if(g)g.volume=Number(val)});break;
 case 'member-volume':mutate(s=>{const d=entity(s.model,target.dataset.id);if(d&&d.status==='online')d.volume=Number(val)});break;
 case 'group-persistent':mutate(s=>{const g=entity(s.model,s.detailOutputId);if(g)g.persistent=target.checked});break;
 case 'bass':mutate(s=>currentDevice().bass=Number(val));break;
 case 'start-volume-enabled':mutate(s=>currentDevice().startVolumeEnabled=target.checked);break;
 case 'start-volume':mutate(s=>currentDevice().startVolume=Number(val));break;
 case 'language':mutate(s=>s.model.settings.language=val);break;
 case 'restore-session':mutate(s=>s.model.settings.restoreSession=target.checked);break;
 case 'auto-update':mutate(s=>s.model.settings.autoUpdate=target.checked);break;
 case 'telemetry':mutate(s=>s.model.settings.telemetry=target.checked);break;
 case 'setup-candidate':mutate(s=>s.setupSelection=val,false);break;
 case 'accent':mutate(s=>{s.designTokens.accent=val;applyDesign()});break;
 case 'appearance':mutate(s=>{s.designTokens.appearance=val;applyDesign()});break;
 case 'density':mutate(s=>{s.designTokens.density=val;applyDesign()});break;
 case 'radius':mutate(s=>{s.designTokens.radius=Number(val);applyDesign()});break;
 case 'sidebar-width':mutate(s=>{s.designTokens.sidebarWidth=Number(val);applyDesign()});break;
 case 'font-size':mutate(s=>{s.designTokens.fontSize=Number(val);applyDesign()});break;
 default:console.warn('Unhandled field:',field)
 }}catch(err){toast(err?.message||String(err))}
}

// ===== src/main.js =====









const app=document.getElementById('app');
const views={listen:renderListen,library:renderListen,history:renderListen,spotify:renderListen,outputs:renderOutputs,group:renderGroup,device:renderDevice,updates:renderUpdates,settings:renderSettings,setup:renderSetup,help:renderHelp,lab:renderLab};
function render(){
 if(!state.model)return;
 const view=views[state.view]||renderListen;
 // Preserve typing position across updates from search or form controls.
 const active=document.activeElement;const field=active?.dataset?.field;const selStart=field&&typeof active.selectionStart==='number'?active.selectionStart:null;
 const focusValue=field?active.value:null;
 app.innerHTML=`<div class="app-shell">${sidebar(state)}<div class="app-main">${header(state)}<main class="workspace" id="workspace">${view(state)}</main></div>${player(state)}</div>${renderDialog(state)}${state.toast?`<div class="toast-message" role="status">${state.toast}${action('dismiss-toast',icon('close'),'icon-btn')}</div>`:''}`;
 if(field){const match=[...document.querySelectorAll('[data-field]')].find(el=>el.dataset.field===field&&(el.value===focusValue||field==='radio-search'||field==='output-search'));
  if(match){match.focus({preventScroll:true});if(selStart!==null&&typeof match.setSelectionRange==='function')try{match.setSelectionRange(selStart,selStart)}catch{}}
 }
}
subscribe(render);
document.addEventListener('click',event=>{const button=event.target.closest('[data-action]');if(button&&!button.disabled){event.preventDefault();onAction(button.dataset.action,button)}});
document.addEventListener('change',event=>{const field=event.target.closest('[data-field]');if(field)onField(field.dataset.field,field)});
document.addEventListener('input',event=>{const field=event.target.closest('[data-field]');if(field&&['radio-search','output-search','accent'].includes(field.dataset.field))onField(field.dataset.field,field)});
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&state.modal)onAction('close-modal',document.createElement('button'));if((event.metaKey||event.ctrlKey)&&event.key===','){event.preventDefault();const b=document.createElement('button');b.dataset.value='settings';onAction('navigate',b)}});
initialize().catch(err=>{app.innerHTML=`<main class="boot"><h1>Could not initialize UI Lab</h1><p>${err.message}</p><p>Run this project through Vite (<code>npm install && npm run dev</code>) rather than opening the HTML file directly.</p></main>`;console.error(err)});

// Google Material Symbols is loaded from Google Fonts. When offline, use a small
// Unicode fallback so the development preview is still readable (no font bundled).
document.fonts.ready.then(()=>{
 const loaded=[...document.fonts].some(f=>f.family.replace(/["']/g,'').includes('Material Symbols')&&f.status==='loaded');
 if(!loaded||new URLSearchParams(location.search).has('offlineIcons'))document.documentElement.classList.add('symbols-missing');
}).catch(()=>document.documentElement.classList.add('symbols-missing'));
</script></body></html>
