<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="464" height="750" viewBox="0 0 464 750" role="img">
  <title>Sicherung wiederherstellen</title>
  <rect x="0" y="0" width="464" height="750" rx="14" fill="#26272C" stroke="#383A40" stroke-width="1"/>
  <text x="24" y="44" font-family="'SF Pro Text', 'SF Pro Display', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="630" fill="#F4F5F7">Sicherung wiederherstellen</text>
  <g transform="translate(420 22) scale(0.9166666666666666)">
