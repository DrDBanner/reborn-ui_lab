" font-family="'SF Pro Text', 'SF Pro Display', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#AFB2BC" data-wrap-width="1124">Balance bei Stereopaaren sowie Center- und Surroundpegel nur anzeigen, wenn die gewählte Ausgabe diese Kanäle meldet.</text><rect x="286" y="582" width="330" height="27" rx="13" fill="#303238" stroke-width="1"/><text x="451.0" y="600" font-family="'SF Pro Text', 'SF Pro Display', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="500" fill="#AFB2BC" text-anchor="middle">Für dieses Einzelgerät nicht verfügbar</text><text x="264" y="676" font-family="'SF Pro Text', 'SF Pro Display', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#AFB2BC">Die aktuelle Lautstärke bleibt im Player. Hier stehen nur dauerhaft relevante Klangeinstellungen.</text></g><g id="persistent-player">
